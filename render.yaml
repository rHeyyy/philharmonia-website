# render.yaml
services:
  - type: web
    name: philharmonia-render  # This will be your app name on Render
    env: python
    region: oregon  # Choose: oregon, singapore, frankfurt, ohio, virginia
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn HARMONY.wsgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: RENDER
        value: 'true'

databases:
  - name: philharmonia-render-db
    databaseName: philharmoniadb
    user: philharmoniauser
    plan: free
    region: oregon